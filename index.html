<!doctype html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <title>O2EM Emulator</title>
    <style>
      body {
        margin: 0;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        background-color: black;
        overflow: hidden;
    }
    #canvas {
        width: 95vw;
        height: 95vh;
        aspect-ratio: 4 / 3;
        max-width: calc(95vh * (4 / 3));
        max-height: calc(95vw * (3 / 4));  
        image-rendering: pixelated;
        display: block;
    }
    </style>
  </head>
  <body>     
    <canvas id="canvas" oncontextmenu="event.preventDefault()" tabindex=-1></canvas>

<script type='text/javascript'>
  var Module = {
    canvas: document.getElementById('canvas'),
    
    preRun: [function() {
      Module.addRunDependency('load-rom');

      fetch('./ROMS/game.bin')
        .then(response => response.arrayBuffer())
        .then(arrayBuffer => {
          const data = new Uint8Array(arrayBuffer);
          if (!FS.analyzePath('/ROMS').exists) FS.mkdir('/ROMS');
          FS.writeFile('/ROMS/game.bin', data);
          console.log("ROM.");
          
          Module.removeRunDependency('load-rom');
        })
        .catch(err => {
          console.error("ROM error:", err);
          Module.removeRunDependency('load-rom'); 
        });
    }],
  };
</script>
    
    <script src="o2em.html.js"></script>
  </body>
</html>
